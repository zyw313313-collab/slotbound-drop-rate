name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        shell: pwsh
        run: ./build.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SlotboundDropRate
          path: dist/SlotboundDropRate.exe

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        shell: pwsh
        run: ./build.ps1

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SlotboundDropRate.exe
          generate_release_notes: true
