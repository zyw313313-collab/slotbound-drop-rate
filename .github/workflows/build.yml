name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        shell: pwsh
        run: ./build.ps1

      - name: 测试
        shell: pwsh
        run: ./tests/run.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: SlotboundDropRate
          path: |
            dist/SlotboundDropRate.exe
            dist/slotbound-compatibility.ini
            dist/SlotboundDropRate.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SlotboundDropRate
          path: dist

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SlotboundDropRate.exe
            dist/slotbound-compatibility.ini
            dist/SlotboundDropRate.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
